name: Offline package checks
'on':
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install the actual package and declared dependencies
        run: python -m pip install .
      - name: Check installed dependency consistency
        run: python -m pip check
      - name: Check installed CLI outside the checkout
        working-directory: ${{ runner.temp }}
        run: video-temporal-audit --help
      - name: Run offline Python tests
        run: python -m unittest discover -s tests -v
      - name: Check browser protocol helpers with hosted-runner Node
        run: |
          node --version
          node tests/test_timeline.js
      - name: Analyze one controlled clip with the installed CLI
        run: >-
          video-temporal-audit analyze
          --video examples/demo_v2/fixtures/media/test_source_1_flicker.mp4
          --config examples/demo_v2/calibration/config.json
          --motion-compensation on --output runs/ci-clip
